<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gastos</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ac:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:14px}
h2{margin:6px 0 12px}.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{width:100%;font:inherit;color:var(--tx);background:#0b1220;border:1px solid #334155;border-radius:12px;padding:13px;margin-bottom:10px}
button.pri{background:var(--ac);color:#04210f;font-weight:700;border:0}
.seg{display:flex;gap:8px}.seg button{margin:0 0 10px}.seg .on{background:var(--ac);color:#04210f;font-weight:700;border:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;margin:0;padding:10px 0;font-size:13px;color:var(--mut)}nav .on{color:var(--ac);font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #334155}.row:last-child{border:0}
.mut{color:var(--mut);font-size:13px}.big{font-size:30px;font-weight:700}.neg{color:var(--bad)}.pos{color:var(--ac)}
.bar{height:6px;background:#334155;border-radius:3px;margin-top:5px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.v{display:none}.v.on{display:block}
input,select{height:50px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.mv{display:flex;justify-content:space-between;gap:10px;padding:8px 0 0;font-size:14px}
</style></head><body>
<div id="toast"></div>
<main>
<section class="v on" id="v-c">
 <h2>Nuevo movimiento</h2>
 <div class="seg"><button id="tg" class="on">Gasto</button><button id="tn">Ganancia</button></div>
 <input id="m" inputmode="decimal" placeholder="Monto ($)">
 <input id="d" placeholder="Descripción" autocapitalize="sentences">
 <select id="c"></select>
 <input id="f" type="date">
 <button class="pri" id="sv">Guardar</button>
 <div class="mut" id="st"></div>
</section>
<section class="v" id="v-h"><h2>Historial</h2><div class="card" id="hl"></div></section>
<section class="v" id="v-r"><h2>Resumen</h2><div id="rs"></div></section>
<section class="v" id="v-x"><h2>Configuración</h2><div class="card">
 <div class="mut">Pegá la URL de tu Apps Script y tu clave (se guardan solo en este teléfono).</div><br>
 <input id="u" placeholder="URL de la app web (termina en /exec)"><input id="k" type="password" placeholder="Clave">
 <button class="pri" id="gc">Guardar</button></div></section>
</main>
<nav><button data-v="c" class="on">Cargar</button><button data-v="h">Historial</button><button data-v="r">Resumen</button><button data-v="x">Ajustes</button></nav>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let H=L('h',[]),cfg=L('cfg',{}),cats=L('cats',{gastos:[],ganancias:[]}),R=L('r',null),tipo='gasto',M=L('m',null),rt='gastos',rcat=null,LM=L('lm',0);
const fm=n=>(+n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2});
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nav(v){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id=='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='h')rH();if(v=='r'){rR();cargar()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
function setTipo(t){tipo=t;$('#tg').classList.toggle('on',t=='gasto');$('#tn').classList.toggle('on',t=='ganancia');rC()}
$('#tg').onclick=()=>setTipo('gasto');$('#tn').onclick=()=>setTipo('ganancia');
function rC(){const l=(tipo=='gasto'?cats.gastos:cats.ganancias);const cur=$('#c').value;$('#c').innerHTML='<option value="" selected disabled>Elegí una categoría</option>'+l.map(c=>`<option>${esc(c)}</option>`).join('');if(l.includes(cur))$('#c').value=cur;
 const p=H.filter(e=>e.s=='p').length;$('#st').textContent=!cfg.url?'Falta configurar en Ajustes':p?`⏳ ${p} pendiente(s) de enviar`:'✓ Todo enviado'}
async function api(b){const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...b,t:cfg.t})});return r.json()}
async function cargar(){if(!cfg.url||!navigator.onLine)return;const t0=Date.now();try{const r=await(await fetch(cfg.url+'?t='+encodeURIComponent(cfg.t))).json();if(r.ok){R=r.r;cats={gastos:R.gastos.cats.map(c=>c.n),ganancias:R.ganancias.cats.map(c=>c.n)};S('r',R);S('cats',cats);M=r.m;S('m',M);LM=t0;S('lm',LM);rC();rR()}else toast(r.error)}catch(e){}}
let busy=0;async function sync(){if(busy||!cfg.url||!navigator.onLine)return;busy=1;
 try{for(;;){const e=[...H].reverse().find(x=>x.s=='p');if(!e)break;const r=await api({a:'agregar',id:e.id,tipo:e.tipo,fecha:e.f,monto:e.m,desc:e.d,cat:e.c});if(r.ok){e.s='ok';e.ts=Date.now();S('h',H);rC();rH()}else{toast(r.error||'Error al enviar');break}}}catch(x){}
 busy=0;rC();rH()}
$('#sv').onclick=()=>{const m=parseFloat($('#m').value.replace(',','.')),c=$('#c').value;if(!m||!c){toast('Completá monto y categoría');return}
 H.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo,f:$('#f').value||hoy(),m,d:$('#d').value.trim(),c,s:'p'});S('h',H);
 $('#m').value='';$('#d').value='';$('#c').value='';$('#f').value=hoy();toast('Guardado');rC();sync()};
function rH(){$('#hl').innerHTML=H.length?H.map(e=>`<div class="row" data-id="${e.id}"><div><b class="${e.tipo=='gasto'?'neg':'pos'}">${e.tipo=='gasto'?'−':'+'}${fm(e.m)}</b> ${e.s=='p'?'⏳':'✓'}<div class="mut">${esc(e.c)} · ${esc(e.d)}</div></div><div class="mut">${e.f.split('-').reverse().join('/')}</div></div>`).join(''):'<div class="mut">Todavía no cargaste nada.</div>';
 document.querySelectorAll('#hl .row').forEach(r=>r.onclick=()=>borrar(r.dataset.id))}
async function borrar(id){const e=H.find(x=>x.id==id);if(!e||!confirm('¿Borrar este movimiento?'))return;
 if(e.s=='ok'){if(!navigator.onLine||!cfg.url){toast('Necesitás internet para borrarlo de la hoja');return}try{const r=await api({a:'borrar',tipo:e.tipo,monto:e.m,desc:e.d,cat:e.c});if(!r.ok){toast('No se encontró en la hoja del mes actual');return}}catch(x){toast('Error de conexión');return}}
 H=H.filter(x=>x.id!=id);S('h',H);rH();rC();cargar()}
const fd=f=>f?f.split('-').reverse().slice(0,2).join('/'):'sin fecha';
function movs(t,cat){const g=t=='gastos',base=((M&&M[g?0:1])||[]).filter(x=>x.c==cat).reverse(),pen=H.filter(e=>(e.s=='p'||(e.ts&&e.ts>LM))&&e.tipo==(g?'gasto':'ganancia')&&e.c==cat).map(e=>({f:e.f,m:e.m,d:e.d,w:e.s=='p'?1:0}));return[...pen,...base]}
function rtab(t){rt=t;rcat=null;rR()}
function rcatTog(i){const n=(rt=='gastos'?R.gastos:R.ganancias).cats[i].n;rcat=rcat==n?null:n;rR()}
function rR(){if(!R){$('#rs').innerHTML='<div class="card mut">Sincronizá con internet al menos una vez.</div>';return}
 const o=rt=='gastos'?R.gastos:R.ganancias;
 $('#rs').innerHTML=`<div class="card"><div class="mut">${esc(R.mes)} · saldo actual</div><div class="big ${R.final<0?'neg':'pos'}">${fm(R.final)}</div><div class="mut">Saldo inicial ${fm(R.inicial)}</div></div><div class="seg"><button class="${rt=='gastos'?'on':''}" onclick="rtab('gastos')">Gastos</button><button class="${rt=='ganancias'?'on':''}" onclick="rtab('ganancias')">Ganancias</button></div><div class="card"><b>Total</b> <span class="mut">${fm(o.r)} de ${fm(o.p)} previsto</span>`+o.cats.map((c,i)=>{const ab=rcat==c.n,ms=ab?movs(rt,c.n):[];
  return `<div class="row" style="display:block" onclick="rcatTog(${i})"><div style="display:flex;justify-content:space-between"><span>${ab?'▾':'▸'} ${esc(c.n)}</span><span>${fm(c.r)}</span></div><div class="mut">previsto ${fm(c.p)}</div><div class="bar"><i style="width:${Math.min(100,c.p?c.r/c.p*100:(c.r?100:0))}%"></i></div>`+(ab?(ms.length?ms.map(x=>`<div class="mv" onclick="event.stopPropagation()"><span>${x.w?'⏳ ':''}${fd(x.f)} · ${esc(x.d)||'sin descripción'}</span><b>${fm(x.m)}</b></div>`).join(''):'<div class="mut" style="padding-top:8px">Sin movimientos este mes</div>'):'')+'</div>'}).join('')+'</div>'}
$('#gc').onclick=()=>{cfg={url:$('#u').value.trim(),t:$('#k').value.trim()};S('cfg',cfg);toast('Guardado');nav('c');cargar().then(rC);sync()};
$('#u').value=cfg.url||'';$('#k').value=cfg.t||'';$('#f').value=hoy();rC();rH();
if(!cfg.url)nav('x');
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden){$('#f').value=hoy();sync()}});sync();cargar();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
